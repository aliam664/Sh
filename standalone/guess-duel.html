<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>دوئل رمز 🔐 — Ali369</title>
<style>
/* ============================================================
   دوئل رمز — نسخهٔ تک‌فایلی دونفره (Pass & Play)
   سازنده: Ali369
   ============================================================ */
:root{
  --bg:#070B18; --s1:rgba(22,31,56,.72); --s2:#1E2947;
  --acc:#2DD4BF; --acc2:#7C5CFF; --gold:#FBBF24;
  --txt:#F1F5FB; --dim:#93A3C4;
  --g:#22C55E; --y:#EAB308; --r:#EF4444;
  --glow:0 0 24px rgba(45,212,191,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
html,body{height:100%}
body{
  margin:0; color:var(--txt); font-family:Tahoma,'Segoe UI',Vazirmatn,sans-serif;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(124,92,255,.22), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(45,212,191,.18), transparent 55%),
    var(--bg);
  display:flex; flex-direction:column; align-items:center;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
#stage{width:100%; max-width:430px; flex:1; display:flex; flex-direction:column; gap:14px}
canvas#confetti{position:fixed; inset:0; pointer-events:none; z-index:50}

/* ---------- کارت شیشه‌ای ---------- */
.card{
  background:var(--s1); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(148,163,196,.16); border-radius:22px; padding:18px;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
}
.center{text-align:center}
h1,h2{margin:0}
.title{
  font-size:52px; font-weight:900; letter-spacing:2px; line-height:1.1;
  background:linear-gradient(135deg, var(--acc), var(--acc2) 55%, var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 18px rgba(45,212,191,.35));
}
.sub{color:var(--dim); font-size:13px}
.badge{
  display:inline-block; margin-top:10px; padding:6px 16px; border-radius:999px;
  border:1px solid rgba(251,191,36,.45); color:var(--gold); font-size:13px; font-weight:bold;
  background:rgba(251,191,36,.07);
}
.muted{color:var(--dim); font-size:13px; line-height:20px}
.gold{color:var(--gold)}
.acc{color:var(--acc)}
b{font-weight:800}

/* ---------- فیلدها و دکمه ---------- */
input[type=text]{
  width:100%; padding:13px 14px; font-size:16px; border-radius:14px; margin-top:8px;
  border:1.5px solid var(--s2); background:rgba(30,41,71,.8); color:var(--txt); outline:none;
  transition:border-color .2s, box-shadow .2s;
}
input[type=text]:focus{border-color:var(--acc); box-shadow:var(--glow)}
.btn{
  width:100%; padding:15px; border:none; border-radius:16px; font-size:17px; font-weight:800;
  background:linear-gradient(135deg,var(--acc),#25b5a2); color:#06121a; cursor:pointer;
  box-shadow:0 8px 24px rgba(45,212,191,.3); transition:transform .12s, box-shadow .2s;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold),#d99e12); box-shadow:0 8px 24px rgba(251,191,36,.28)}
.btn.ghost{background:rgba(30,41,71,.9); color:var(--dim); box-shadow:none}
.btn:disabled{background:var(--s2); color:var(--dim); box-shadow:none}

/* ---------- تایل‌ها و باکس رقم ---------- */
.ltr{direction:ltr; display:flex; gap:8px; justify-content:center}
.box{
  width:56px; height:56px; border-radius:15px; background:var(--s2);
  display:flex; align-items:center; justify-content:center;
  font-size:25px; font-weight:900; transition:all .18s;
  border:1px solid rgba(148,163,196,.14);
}
.box.next{border-color:var(--acc); box-shadow:var(--glow); animation:pulse 1.2s infinite}
.box.filld{background:rgba(45,212,191,.12); border-color:rgba(45,212,191,.5)}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(45,212,191,.2)}50%{box-shadow:var(--glow)}}
.tile{
  width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:20px; font-weight:900; color:#fff; animation:pop .28s ease backwards;
}
.tile:nth-child(1){animation-delay:.02s}.tile:nth-child(2){animation-delay:.08s}
.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.2s}
@keyframes pop{from{transform:scale(.4) rotateX(80deg); opacity:0}to{transform:none; opacity:1}}
.tg{background:linear-gradient(145deg,#27c95f,#139a42); box-shadow:0 4px 14px rgba(34,197,94,.35)}
.ty{background:linear-gradient(145deg,#f4c11c,#c79a07); color:#2a1c00; box-shadow:0 4px 14px rgba(234,179,8,.3)}
.tr{background:linear-gradient(145deg,#f05252,#c22727); box-shadow:0 4px 14px rgba(239,68,68,.3)}

/* ---------- کی‌پد ---------- */
.pad{display:flex; flex-direction:column; gap:10px; align-items:center; direction:ltr}
.prow{display:flex; gap:10px}
.key{
  width:74px; height:70px; border-radius:20px; background:var(--s2);
  display:flex; align-items:center; justify-content:center;
  font-size:26px; font-weight:900; cursor:pointer; user-select:none;
  border:1px solid rgba(148,163,196,.12); transition:transform .1s, background .15s;
}
.key:active{transform:scale(.93); background:#26345c}
.key.ok{background:linear-gradient(135deg,var(--acc),#1fa893); color:#06121a; box-shadow:var(--glow)}
.key.off{opacity:.35; pointer-events:none}

/* ---------- تاریخچه و وضعیت ---------- */
.guessrow{display:flex; align-items:center; justify-content:space-between; padding:5px 2px; border-bottom:1px dashed rgba(148,163,196,.1)}
.guessrow:last-child{border-bottom:none}
.hist{max-height:190px; overflow-y:auto; scrollbar-width:thin}
.dotrow{display:flex; gap:6px; justify-content:center; margin:2px 0 0}
.dot{width:9px; height:9px; border-radius:50%; background:var(--s2); transition:all .3s}
.dot.used{background:var(--r)}
.dot.left{background:var(--acc); box-shadow:0 0 8px rgba(45,212,191,.6)}

/* ---------- صفحه پاس‌گوشی ---------- */
.passwrap{flex:1; display:flex; align-items:center; justify-content:center}
.passbig{font-size:26px; font-weight:900; text-align:center; line-height:1.6}
.phone{font-size:64px; display:block; margin-bottom:8px; animation:sway 2.2s infinite ease-in-out}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/* ---------- نوبت ---------- */
.turnbar{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:12px 16px; border-radius:16px;
  background:linear-gradient(135deg, rgba(124,92,255,.25), rgba(45,212,191,.15));
  border:1px solid rgba(124,92,255,.3);
}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- فینال ---------- */
.crown{font-size:72px; animation:drop .7s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes drop{from{transform:translateY(-80px) scale(.3) rotate(-20deg); opacity:0}to{transform:none; opacity:1}}

/* ---------- فوتر سازنده ---------- */
footer{margin-top:6px; text-align:center; color:var(--dim); font-size:12.5px}
footer .by{color:var(--gold); font-weight:800}
.fade{animation:f .3s ease}
@keyframes f{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
.vs{font-weight:900; color:var(--acc2); font-size:14px; padding:2px 12px}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="stage"></div>
<footer>ساخته‌شده با 💛 توسط <span class="by">Ali369</span></footer>

<script>
"use strict";
/* ================================================================
   منطق بازی — دوئل رمز (دونفره روی یک گوشی)
   هر بازیکن یک رمز ۴ رقمی مخفی می‌سازد؛ نوبت‌ها جابه‌جا می‌شوند.
   هر حدس با رنگ ارزیابی می‌شود: 🟩 دقیقاً سر جایش / 🟨 هست ولی جایش نه / 🟥 نیست
   ================================================================ */

const MAX_TURNS = 10;                 // سقف حدس برای هر بازیکن
const LEN = 4;
const stage = document.getElementById('stage');

let S = null;                          // وضعیت کامل بازی
let input = "";                        // بافر ورودی فعلی
let showSecret = false;                // نمایش رمز هنگام مرحلهٔ ساخت (چشم 👁)

newGame();

function newGame(){
  S = {
    step: "intro",                     // intro | secret | pass | turn | result
    names: ["بازیکن ۱","بازیکن ۲"],
    secrets: ["",""],
    settingFor: 0,                     // کدام بازیکن دارد رمز می‌سازد
    turn: 0,
    passTo: 0,
    attempts: [[],[]],                 // [{g, tiles, solved}]
    winner: -2,                        // -2 هنوز مشخص نیست | -1 مساوی | 0/1
    reason: "",
  };
  input = ""; showSecret = false;
  render();
}

/* ---------------- داور دوپاس (با تکرار هم دروغ نمی‌گوید) ---------------- */
function judge(secret, guess){
  const res = [2,2,2,2], left = {};
  for(let i=0;i<LEN;i++){
    if(guess[i]===secret[i]) res[i]=0;
    else left[secret[i]] = (left[secret[i]]||0)+1;
  }
  for(let i=0;i<LEN;i++){
    if(res[i]===0) continue;
    const d = guess[i];
    if(left[d]>0){ res[i]=1; left[d]--; }
  }
  return res;
}
const solvedAll = t => t.every(x=>x===0);
const bestRank = list =>{
  let best=[-1,-1];
  list.forEach(a=>{
    const g=a.tiles.filter(x=>x===0).length, y=a.tiles.filter(x=>x===1).length;
    if(g>best[0]||(g===best[0]&&y>best[1])) best=[g,y];
  });
  return best;
};

/* ---------------- صدا (WebAudio، بدون فایل) ---------------- */
let AC=null, muted=false;
function tone(f,t,dur,type="sine",vol=.14){
  if(muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, AC.currentTime+dur);
    o.connect(g).connect(AC.destination); o.start(AC.currentTime+t); o.stop(AC.currentTime+t+dur);
  }catch(e){}
}
const sClick=()=>tone(520,0,.06,"triangle",.08);
const sOk   =()=>{tone(620,0,.09);tone(830,.09,.12);};
const sBad  =()=>tone(180,0,.18,"sawtooth",.06);
const sWin  =()=>{[523,659,784,1046].forEach((f,i)=>tone(f,i*.12,.18));};
const vib   =ms=>{ try{ navigator.vibrate && navigator.vibrate(ms);}catch(e){} };

/* ---------------- اکشن‌ها ---------------- */
function startSetup(){
  const n1=(document.getElementById('n1').value||"").trim().slice(0,12)||"بازیکن ۱";
  const n2=(document.getElementById('n2').value||"").trim().slice(0,12)||"بازیکن ۲";
  if(n1===n2){ shake('introNames'); return; }
  S.names=[n1,n2]; S.step="secret"; S.settingFor=0; input=""; render();
}
function confirmSecret(){
  if(input.length!==LEN){ shake('secretBoxes'); sBad(); return; }
  S.secrets[S.settingFor]=input; input="";
  if(S.settingFor===0){ S.passTo=1; S.step="pass"; S.passNext="secret2"; }
  else{ S.passTo=0; S.step="pass"; S.passNext="turn0"; }
  sOk(); vib(30); render();
}
function passReady(){
  if(S.passNext==="secret2"){ S.step="secret"; S.settingFor=1; }
  else{ S.step="turn"; S.turn=S.passNext==="turn0"?0:1; }
  input=""; sClick(); render();
}
function doGuess(){
  if(input.length!==LEN){ shake('guessBoxes'); sBad(); return; }
  const me=S.turn, you=1-me;
  if(S.attempts[me].some(x=>x.solved)){   // قبلاً حل کرده — نوبتش فقط پاس می‌شود
    S.passTo=you; S.step="pass"; S.passNext="turn"+you; input=""; render(); return;
  }
  const tiles=judge(S.secrets[you], input);
  const entry={g:input, tiles, solved:solvedAll(tiles)};
  S.attempts[me].unshift(entry);
  input="";
  if(entry.solved){ sWin(); vib([60,40,60]); } else { sOk(); vib(25); }
  finishCheck();
  if(S.step!=="result"){ S.passTo=you; S.step="pass"; S.passNext="turn"+you; }
  render();
}
function finishCheck(){
  const [a0,a1]=S.attempts;
  const s0=a0.find(x=>x.solved), s1=a1.find(x=>x.solved);
  const full0=a0.length>=MAX_TURNS, full1=a1.length>=MAX_TURNS;
  // هر دو حل کردند؟ → تعداد حدس کمتر برنده است (مساوی → مساوی)
  if(s0&&s1){
    const n0=a0.length, n1=a1.length;
    S.winner = n0===n1 ? -1 : (n0<n1?0:1);
    S.reason = n0===n1 ? "هر دو هم‌زمان شکستید!" : "با تعداد حدس کمتر";
  }
  else if(s0){ /* به بازیکن ۲ فرصت آخر: اگر او هم در نوبتش حل کرد بالا حساب می‌شود */
    if(full1||s1){ S.winner=0; S.reason="رمز حریف را شکست"; }
  }
  else if(s1){ if(full0){ S.winner=1; S.reason="رمز حریف را شکست"; } }
  if(S.winner===-2 && full0&&full1){
    // هیچ‌کس حل نکرد → نزدیک‌ترین حدس
    const b0=bestRank(a0), b1=bestRank(a1);
    const c=(b0[0]*10+b0[1])-(b1[0]*10+b1[1]);
    S.winner = c===0?-1:(c>0?0:1);
    S.reason = c===0?"نزدیکی حدس‌ها مساوی بود":"حدس‌های نزدیک‌تر به جواب";
  }
  if(S.winner!==-2){ S.step="result"; fireConfetti(); sWin(); }
}
function tilesHtml(guess,tiles){
  let h='<div class="ltr">';
  for(let i=0;i<LEN;i++){
    const c=tiles[i]===0?'tg':(tiles[i]===1?'ty':'tr');
    h+='<div class="tile '+c+'">'+guess[i]+'</div>';
  }
  return h+'</div>';
}
function boxesHtml(len, masked){
  let h='<div class="ltr" id="'+(masked?'secretBoxes':'guessBoxes')+'">';
  for(let i=0;i<LEN;i++){
    const c=input[i], cls=i===input.length?'box next':(c?'box filld':'box');
    const ch = c ? (masked && !showSecret ? '●' : c) : '·';
    h+='<div class="'+cls+'">'+ch+'</div>';
  }
  return h+'</div>';
}
function keypadHtml(okLabel,target){
  const rows=[['1','2','3'],['4','5','6'],['7','8','9']];
  let h='<div class="pad">';
  rows.forEach(r=>{ h+='<div class="prow">';
    r.forEach(d=>h+='<div class="key" onclick="kd(\''+d+'\')">'+d+'</div>');
    h+='</div>'; });
  h+='<div class="prow">'
    +'<div class="key" onclick="kb()">⌫</div>'
    +'<div class="key" onclick="kd(\'0\')">0</div>'
    +'<div class="key '+(input.length===LEN?'ok':'off')+'" onclick="'+target+'()">✓</div>'
    +'</div></div>';
  return h;
}
function kd(d){ if(input.length<LEN){ input+=d; sClick(); draw(); } }
function kb(){ if(input){ input=input.slice(0,-1); sClick(); draw(); } }
function shake(id){ const el=document.getElementById(id); if(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');} vib([30,30,30]); }
function toggleMute(){ muted=!muted; draw(); }
function toggleEye(){ showSecret=!showSecret; draw(); }

/* ---------------- رندر صفحه‌ها ---------------- */
function render(){
  let h="";
  if(S.step==="intro") h=vIntro();
  else if(S.step==="secret") h=vSecret();
  else if(S.step==="pass") h=vPass();
  else if(S.step==="turn") h=vTurn();
  else h=vResult();
  stage.innerHTML='<div class="fade" style="display:flex;flex-direction:column;gap:14px;flex:1">'+h+'</div>';
  draw();
}
function draw(){ render(); } /* رندر سبکِ لحظه‌ای برای بافر ورودی */

function vIntro(){
  return ''
  +'<div class="center" style="padding-top:26px">'
  +'<div class="crown">🔐</div>'
  +'<div class="title">دوئل رمز</div>'
  +'<div class="sub">دو نفر، یک گوشی، یک ذهن تیزتر! حریف را با رنگ‌ها شکار کن 🟩🟨🟥</div>'
  +'<span class="badge">سازنده • Ali369</span></div>'
  +'<div class="card" id="introNames"><b>اسم‌ها را بنویسید</b>'
  +'<input type="text" id="n1" maxlength="12" placeholder="نام بازیکن ۱" autocomplete="off">'
  +'<input type="text" id="n2" maxlength="12" placeholder="نام بازیکن ۲" autocomplete="off"></div>'
  +'<button class="btn gold" onclick="startSetup()">شروع دوئل ⚔️</button>'
  +'<div class="card muted">📜 <b>قانون:</b> هر کس یک کد ۴ رقمی مخفی می‌سازد (تکرار مجاز، حتی با صفر اول). نوبت به نوبت رمز حریف را حدس می‌زنید؛ کسی که زودتر (با حدس کمتر) رمز را بشکند، پادشاه است 👑 — هرکدام '+MAX_TURNS+' حدس فرصت دارید.</div>'
  +muteBtn();
}
function vSecret(){
  const me=S.names[S.settingFor];
  return ''
  +'<div class="card center">'
  +'<div class="phone">🛡️</div>'
  +'<h2>'+esc(me)+'</h2>'
  +'<div class="muted" style="margin-top:4px">کد مخفی‌ات را بساز — حریفت نباید ببیند! 🤫</div></div>'
  +boxesHtml(LEN,true)
  +'<button class="btn ghost" onclick="toggleEye()">'+(showSecret?'🙈 پنهان‌نمایش':'👁 نمایش موقت')+'</button>'
  +keypadHtml('✓','confirmSecret')
  +muteBtn();
}
function vPass(){
  const to=S.names[S.passTo];
  return ''
  +'<div class="passwrap"><div class="center">'
  +'<span class="phone">📲</span>'
  +'<div class="passbig">گوشی را بده به<br><span class="acc" style="font-size:32px">'+esc(to)+'</span></div>'
  +'<div class="muted" style="margin:10px 0 18px">'+(S.passNext==="secret2"?"او باید رمز مخفی‌اش را بسازد 🛡️":"نوبتش است که حدس بزند 🎯")+'</div>'
  +'<button class="btn" style="max-width:260px;margin:auto" onclick="passReady()">آماده‌ام ✓</button>'
  +'</div></div>';
}
function vTurn(){
  const me=S.turn, you=1-me;
  const myList=S.attempts[me];
  const left=MAX_TURNS-myList.length;
  let dots='<div class="dotrow" title="حدس‌ها">';
  for(let i=0;i<MAX_TURNS;i++) dots+='<div class="dot '+(i<left?'left':'used')+'"></div>';
  dots+='</div>';
  return ''
  +'<div class="turnbar"><div>🎯 نوبت: <b>'+esc(S.names[me])+'</b></div>'
  +'<div class="muted">شکار رمزِ <b class="gold">'+esc(S.names[you])+'</b></div></div>'
  +dots
  +'<div class="card"><b>حدس‌های تو</b><div class="hist" style="margin-top:8px">'
  +(myList.length? myList.map((a,i)=>'<div class="guessrow"><span class="muted">'+(myList.length-i)+'</span>'+tilesHtml(a.g,a.tiles)+'</div>').join('')
    :'<div class="muted">هنوز حدسی نزده‌ای — رنگ‌ها راهنمایت‌اند:<br>🟩 درست سر جایش · 🟨 هست ولی جایش نه · 🟥 اصلاً نیست</div>')
  +'</div></div>'
  +'<div class="muted center">حریف تا الان '+S.attempts[you].length+' حدس زده</div>'
  +boxesHtml(LEN,false)
  +keypadHtml('✓','doGuess')
  +muteBtn();
}
function vResult(){
  const W=S.winner, n0=S.attempts[0].length, n1=S.attempts[1].length;
  const head = W===-1
    ? '<div class="crown">🤝</div><h2 class="center">مساوی!</h2><div class="muted center">'+esc(S.reason)+'</div>'
    : '<div class="crown">👑</div><h2 class="center gold" style="font-size:30px">'+esc(S.names[W])+'</h2><div class="muted center">برنده شد — '+esc(S.reason)+' 🎉</div>';
  const secList=[0,1].map(i=>''
    +'<div class="center"><div class="muted">'+esc(S.names[i])+'</div>'
    +'<div style="font-weight:900;font-size:22px;letter-spacing:4px;direction:ltr;margin:4px 0">'+(S.secrets[i]||"····")+'</div>'
    +'<div class="muted">'+S.attempts[i].length+' حدس</div></div>').join('<div class="vs">VS</div>');
  let histHtml='';
  [0,1].forEach(i=>{
    histHtml+='<div class="card"><b>'+esc(S.names[i])+'</b><div class="hist" style="margin-top:8px">'
      +(S.attempts[i].length? S.attempts[i].map((a,k)=>'<div class="guessrow"><span class="muted">'+(S.attempts[i].length-k)+'</span>'+tilesHtml(a.g,a.tiles)+'</div>').join('') : '<div class="muted">—</div>')
      +'</div></div>';
  });
  return ''
  +'<div class="card" style="padding:22px 18px;margin-top:8px">'+head+'</div>'
  +'<div class="card"><div class="center muted" style="margin-bottom:10px">رمزها فاش شد:</div>'
  +'<div style="display:flex;justify-content:space-around;align-items:center">'+secList+'</div></div>'
  +histHtml
  +'<button class="btn gold" onclick="newGame()">بازی دوباره 🔁</button>'
  +'<div class="card center">🏆 سازندهٔ این بازی: <b class="gold">Ali369</b></div>';
}

/* ---------------- کاغذرنگی 🎊 ---------------- */
function fireConfetti(){
  const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
  cv.width=innerWidth; cv.height=innerHeight;
  const colors=['#2DD4BF','#FBBF24','#22C55E','#EF4444','#7C5CFF','#EAB308'];
  const parts=[];
  for(let i=0;i<160;i++) parts.push({
    x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5,
    w:6+Math.random()*6, h:8+Math.random()*8,
    vy:2+Math.random()*3, vx:-1.5+Math.random()*3,
    c:colors[i%colors.length], r:Math.random()*Math.PI, vr:-.1+Math.random()*.2
  });
  const t0=performance.now();
  (function tick(t){
    cx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{
      p.x+=p.vx+Math.sin((t+p.y)/300); p.y+=p.vy; p.r+=p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
      cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore();
    });
    if(t-t0<4200) requestAnimationFrame(tick); else cx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function muteBtn(){ return '<button class="btn ghost" style="padding:9px" onclick="toggleMute()">'+(muted?'🔇 بی‌صدا':'🔊 صدا روشن')+'</button>'; }
</script>
