name: Build Ramzo APK

on:
  push:
    branches: [ arena/019fb378-sh ]
  workflow_dispatch:

permissions:
  contents: write   # برای ساخت/به‌روزرسانی ریلیز Nightly

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build (assembleDebug)
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramzo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish Nightly release (APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "$APK" --clobber
          else
            gh release create nightly "$APK" \
              --title "Ramzo Nightly (نصب روی گوشی میزبان)" \
              --notes "آخرین ساخت خودکار از برنچ توسعه. این فایل را روی گوشی اندرویدی میزبان نصب کنید؛ مهمان‌ها چیزی نصب نمی‌کنند." \
              --prerelease
          fi
