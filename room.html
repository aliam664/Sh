<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>اتاق انتظار — Bluff / Bid</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

<div class="app">
  <header class="appbar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="خروج از اتاق"></button>
    <div class="grow">
      <h1 class="appbar__title">اتاق انتظار</h1>
      <div class="appbar__sub" id="roomSub">…</div>
    </div>
    <span class="badge" id="statusBadge">در انتظار</span>
  </header>

  <main class="page stack">

    <!-- کد اتاق -->
    <section class="glass card stack-2 center">
      <span class="label">کد اتاق</span>
      <div class="input input--code" id="codeDisplay" role="text" aria-label="کد اتاق">------</div>
      <div class="row" style="justify-content:center">
        <button class="btn btn--ghost btn--sm" id="copyBtn" type="button">کپی کد</button>
        <button class="btn btn--ghost btn--sm" id="shareBtn" type="button">اشتراک‌گذاری</button>
      </div>
      <p class="small dim">این کد را برای دوستانت بفرست. حداقل ۳ و حداکثر ۸ نفر.</p>
    </section>

    <!-- بازیکنان -->
    <section class="glass card stack-2">
      <div class="row row--between">
        <h2 style="margin:0">بازیکنان</h2>
        <span class="badge" id="countBadge">0/8</span>
      </div>
      <div class="stack-2 players-grid" id="playerList"></div>
    </section>

    <!-- تنظیمات (فقط Host) -->
    <section class="glass card stack hidden" id="hostSettings">
      <h2>تنظیمات بازی</h2>

      <div class="field">
        <span class="label">شرط پایان</span>
        <div class="choice-group" id="endModeRow">
          <button class="choice" type="button" data-mode="rounds">تعداد دور</button>
          <button class="choice" type="button" data-mode="target">امتیاز هدف</button>
        </div>
      </div>

      <div class="field" id="roundsField">
        <span class="label">چند دور؟</span>
        <div class="choice-group" id="roundsRow">
          <button class="choice" type="button" data-rounds="5">۵ دور</button>
          <button class="choice" type="button" data-rounds="10">۱۰ دور</button>
        </div>
      </div>

      <div class="field hidden" id="targetField">
        <label class="label" for="targetInput">امتیاز هدف</label>
        <input class="input input--num" id="targetInput" type="number" inputmode="numeric" min="5" max="50" value="15">
      </div>

      <div class="field">
        <label class="label" for="difficultySelect">سطح سختی</label>
        <select class="select" id="difficultySelect">
          <option value="mixed">ترکیبی</option>
          <option value="easy">آسان</option>
          <option value="medium">متوسط</option>
          <option value="hard">سخت</option>
        </select>
      </div>

      <div class="field">
        <span class="label">دسته‌های سوال <span class="dim small">(خالی = همه)</span></span>
        <div class="row row--wrap" id="catRow"></div>
      </div>

      <button class="btn btn--ghost btn--block" id="saveSettingsBtn" type="button">ذخیره‌ی تنظیمات</button>
    </section>

    <section class="glass card stack-2" id="guestNote">
      <h3>راهنما</h3>
      <p class="small dim">
        قبل از شروع، همه در یک تماس صوتی جدا (دیسکورد / واتس‌اپ / تلگرام) جمع شوید.
        وقتی آماده بودی دکمه‌ی «آماده‌ام» را بزن.
      </p>
    </section>

  </main>

  <div class="actionbar">
    <button class="btn btn--success btn--block btn--lg" id="readyBtn" type="button">آماده‌ام</button>
    <button class="btn btn--primary btn--block btn--lg hidden" id="startBtn" type="button">شروع بازی</button>
  </div>
</div>

<script type="module">
/** اتاق انتظار: لیست بازیکنان، Ready، تنظیمات Host، شروع بازی */
import { pageGuard } from "./js/firebase-auth.js";
import {
  setReady, updateSettings, MIN_PLAYERS, MAX_PLAYERS, STATUS, deleteRoom
} from "./js/database.js";
import { RoomSession, attemptJoin, inviteLink, clearActiveRoom } from "./js/room.js";
import { hostStartGame, isPlayerOnline } from "./js/game-engine.js";
import { CATEGORIES, CATEGORY_LABELS } from "./js/questions.js";
import {
  el, $, $$, avatar, icon, toast, clear, copyText, shareLink, haptic, HAPTIC,
  setConnectionState, registerServiceWorker, confirmDialog, setBusy, skeleton, fatalScreen
} from "./js/ui.js";
import { sanitizeRoomCode, isValidRoomCode, clampInt, log } from "./js/security.js";

registerServiceWorker();

const roomId = sanitizeRoomCode(new URLSearchParams(location.search).get("code") || "");
let session = null;
let me = null;
let selectedCats = new Set();
let localEndMode = "rounds";
let localRounds = 5;
let settingsDirty = false;

$("#backBtn").append(icon("back", 20));

if (!isValidRoomCode(roomId)) {
  fatalScreen("کد اتاق نامعتبر", "لینکی که باز کردی درست نیست.", "بازگشت به خانه", "./lobby.html");
} else {
  $("#codeDisplay").textContent = roomId;
  $("#roomSub").textContent = `کد ${roomId}`;
  clear($("#playerList"));
  $("#playerList").append(skeleton(3, 62));
  boot();
}

/* ═══════════ رندر ═══════════ */

function renderPlayers(players, room) {
  const list = $("#playerList");
  clear(list);

  players.forEach((p) => {
    const uid = p.userId || p.id;
    const online = isPlayerOnline(p);
    const card = el("div", {
      class: `player-card ${uid === me.uid ? "is-me" : ""} ${online ? "" : "is-offline"}`
    }, [
      avatar(p.name, uid, 44),
      el("div", { class: "grow stack-2" }, [
        el("div", { class: "player-card__name", text: p.name || "بازیکن" }),
        el("div", { class: "player-card__meta" }, [
          el("span", { class: `dot ${online ? "dot--on" : "dot--off"}` }),
          el("span", { text: online ? "آنلاین" : "آفلاین" })
        ])
      ]),
      p.isHost || room.hostId === uid ? el("span", { class: "badge badge--host", text: "میزبان" }) : null,
      p.isReady ? el("span", { class: "badge badge--ready", text: "آماده" }) : el("span", { class: "badge", text: "منتظر" })
    ]);
    list.append(card);
  });

  $("#countBadge").textContent = `${players.length}/${MAX_PLAYERS}`;
}

function renderControls(room, players) {
  const isHost = room.hostId === me.uid;
  const mine = players.find((p) => (p.userId || p.id) === me.uid);
  const onlineCount = players.filter(isPlayerOnline).length;
  const readyCount = players.filter((p) => p.isReady && isPlayerOnline(p)).length;

  $("#hostSettings").classList.toggle("hidden", !isHost);
  $("#guestNote").classList.toggle("hidden", isHost);

  const readyBtn = $("#readyBtn");
  const startBtn = $("#startBtn");

  if (mine) {
    readyBtn.textContent = mine.isReady ? "آماده نیستم" : "آماده‌ام";
    readyBtn.className = `btn btn--block btn--lg ${mine.isReady ? "btn--ghost" : "btn--success"}`;
  }

  startBtn.classList.toggle("hidden", !isHost);
  if (isHost) {
    const canStart = onlineCount >= MIN_PLAYERS && readyCount >= onlineCount;
    startBtn.disabled = !canStart;
    startBtn.textContent = onlineCount < MIN_PLAYERS
      ? `حداقل ${MIN_PLAYERS} بازیکن لازم است`
      : (canStart ? "شروع بازی" : `${readyCount}/${onlineCount} نفر آماده‌اند`);
  }

  $("#statusBadge").textContent = room.status === STATUS.PLAYING ? "در حال بازی" : "در انتظار";
}

function renderHostSettings(room) {
  if (settingsDirty) return;   // در حال ویرایش کاربر، مقادیر را بازنویسی نکن
  const s = room.settings || {};
  localEndMode = s.endMode || "rounds";
  localRounds = Number(s.maxRounds) || 5;
  selectedCats = new Set(Array.isArray(s.categories) ? s.categories : []);

  $$("#endModeRow .choice").forEach((b) => b.classList.toggle("is-active", b.dataset.mode === localEndMode));
  $$("#roundsRow .choice").forEach((b) => b.classList.toggle("is-active", Number(b.dataset.rounds) === localRounds));
  $("#roundsField").classList.toggle("hidden", localEndMode !== "rounds");
  $("#targetField").classList.toggle("hidden", localEndMode !== "target");
  $("#targetInput").value = Number(s.targetScore) || 15;
  $("#difficultySelect").value = room.difficulty || "mixed";
  $$("#catRow .chip").forEach((c) => c.classList.toggle("is-active", selectedCats.has(c.dataset.cat)));
}

/* ═══════════ تعامل‌ها ═══════════ */

CATEGORIES.forEach((cat) => {
  const chip = el("button", { class: "chip", type: "button", dataset: { cat } }, [CATEGORY_LABELS[cat] || cat]);
  chip.addEventListener("click", () => {
    settingsDirty = true;
    if (selectedCats.has(cat)) selectedCats.delete(cat); else selectedCats.add(cat);
    chip.classList.toggle("is-active", selectedCats.has(cat));
  });
  $("#catRow").append(chip);
});

$$("#endModeRow .choice").forEach((btn) => btn.addEventListener("click", () => {
  settingsDirty = true;
  localEndMode = btn.dataset.mode;
  $$("#endModeRow .choice").forEach((b) => b.classList.toggle("is-active", b === btn));
  $("#roundsField").classList.toggle("hidden", localEndMode !== "rounds");
  $("#targetField").classList.toggle("hidden", localEndMode !== "target");
}));

$$("#roundsRow .choice").forEach((btn) => btn.addEventListener("click", () => {
  settingsDirty = true;
  localRounds = Number(btn.dataset.rounds);
  $$("#roundsRow .choice").forEach((b) => b.classList.toggle("is-active", b === btn));
}));

$("#targetInput").addEventListener("input", () => { settingsDirty = true; });
$("#difficultySelect").addEventListener("change", () => { settingsDirty = true; });

$("#saveSettingsBtn").addEventListener("click", async () => {
  const btn = $("#saveSettingsBtn");
  setBusy(btn, true, "در حال ذخیره…");
  try {
    await updateSettings(roomId, {
      endMode: localEndMode,
      maxRounds: localRounds,
      targetScore: clampInt($("#targetInput").value, 5, 50),
      categories: [...selectedCats]
    }, $("#difficultySelect").value);
    settingsDirty = false;
    toast("تنظیمات ذخیره شد", "success");
    haptic(HAPTIC.TAP);
  } catch (err) {
    log.error("updateSettings", err);
    toast("ذخیره‌ی تنظیمات ممکن نشد", "error");
  } finally {
    setBusy(btn, false);
  }
});

$("#copyBtn").addEventListener("click", async () => {
  const ok = await copyText(roomId);
  toast(ok ? "کد کپی شد" : "کپی ممکن نشد", ok ? "success" : "error");
  haptic(HAPTIC.TAP);
});

$("#shareBtn").addEventListener("click", async () => {
  const res = await shareLink({
    title: "Bluff / Bid",
    text: `بیا بازی کنیم! کد اتاق: ${roomId}`,
    url: inviteLink(roomId)
  });
  if (res === "copied") toast("لینک دعوت کپی شد", "success");
  else if (res === "failed") toast("اشتراک‌گذاری ممکن نشد", "error");
});

$("#readyBtn").addEventListener("click", async () => {
  const mine = session?.me;
  if (!mine) return;
  haptic(HAPTIC.TAP);
  try { await setReady(roomId, me.uid, !mine.isReady); }
  catch (err) { log.error("setReady", err); toast("ثبت نشد، دوباره بزن", "error"); }
});

$("#startBtn").addEventListener("click", async () => {
  const btn = $("#startBtn");
  setBusy(btn, true, "در حال شروع…");
  try {
    await hostStartGame({ roomId, room: session.room, players: session.players });
    haptic(HAPTIC.BID);
  } catch (err) {
    log.error("startGame", err);
    toast(err.message || "شروع بازی ممکن نشد", "error");
    setBusy(btn, false);
  }
});

$("#backBtn").addEventListener("click", async () => {
  const isHost = session?.isHost;
  const ok = await confirmDialog(
    "خروج از اتاق",
    isHost ? "تو میزبانی. با خروجت میزبانی به بازیکن بعدی می‌رسد." : "می‌خواهی از اتاق خارج شوی؟",
    "خروج"
  );
  if (!ok) return;
  await session.leave();
  clearActiveRoom();
  location.replace("./lobby.html");
});

/* ═══════════ بوت ═══════════ */

async function boot() {
  try {
    const { user, profile } = await pageGuard();
    me = user;

    const join = await attemptJoin({ roomId, uid: user.uid, name: profile.username });
    if (!join.ok) {
      fatalScreen("ورود به اتاق ممکن نشد", join.message, "بازگشت به خانه", "./lobby.html");
      return;
    }

    session = new RoomSession({ roomId, uid: user.uid, name: profile.username });

    session.on("room", (room) => {
      if (room.status === STATUS.PLAYING) {
        location.replace(`./game.html?code=${roomId}`);
        return;
      }
      renderHostSettings(room);
      if (session.players.length) {
        renderPlayers(session.players, room);
        renderControls(room, session.players);
      }
    });

    session.on("players", (players) => {
      if (!session.room) return;
      renderPlayers(players, session.room);
      renderControls(session.room, players);
    });

    session.on("host", ({ name }) => toast(`${name} میزبان جدید شد`, "warn", 4200));
    session.on("connection", (s) => setConnectionState(s));
    session.on("gone", () => {
      clearActiveRoom();
      fatalScreen("اتاق بسته شد", "میزبان اتاق را حذف کرده است.", "بازگشت به خانه", "./lobby.html");
    });
    session.on("error", (err) => log.error("session", err));

    await session.start();

    // به‌روزرسانی دوره‌ای نمای Presence (بدون خواندن دیتابیس — فقط رندر محلی)
    const tick = setInterval(() => {
      if (session.room && session.players.length) {
        renderPlayers(session.players, session.room);
        renderControls(session.room, session.players);
      }
    }, 5000);
    window.addEventListener("pagehide", () => clearInterval(tick), { once: true });

  } catch (err) {
    if (err && (err.message === "redirect-login" || err.message === "firebase-config-missing")) return;
    log.error("room boot", err);
    toast("اتصال به اتاق ممکن نشد", "error", 6000);
  }
}
</script>
</body>
</html>
