<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="description" content="بازی آنلاین چندنفره‌ی بلوف و مناقصه — داور و تخته‌ی امتیاز برای بازی با دوستان در تماس صوتی">
<title>Bluff / Bid — بازی آنلاین بلوف</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body>

<main class="splash" id="splash">
  <div class="stack center">
    <h1 class="splash__logo">Bluff&nbsp;/&nbsp;Bid</h1>
    <p class="splash__tag">بلوف بزن، مناقصه کن، برنده شو</p>
    <div class="spinner" id="spinner" role="status" aria-label="در حال بارگذاری"></div>
    <p class="small dim" id="status">در حال اتصال…</p>
  </div>
</main>

<script type="module">
/**
 * Splash — ورود ناشناس خودکار و مسیریابی.
 * اگر کاربر نام دارد ⇒ lobby ، در غیر این صورت ⇒ login
 */
import { ensureSignedIn, fetchProfile } from "./js/firebase-auth.js";
import { toast, registerServiceWorker, fatalScreen } from "./js/ui.js";
import { store, log } from "./js/security.js";

registerServiceWorker();

const statusEl = document.getElementById("status");
const setStatus = (t) => { statusEl.textContent = t; };

// اگر کاربر با لینک دعوت آمده، کد را نگه می‌داریم تا بعد از ورود منتقل شود
const incomingCode = new URLSearchParams(location.search).get("code");

(async () => {
  try {
    setStatus("ورود ناشناس…");
    const user = await ensureSignedIn();

    setStatus("خواندن پروفایل…");
    const profile = await fetchProfile(user.uid);

    // کمی مکث تا انیمیشن اسپلش دیده شود (تجربه‌ی کاربری، نه انتظار الکی)
    await new Promise((r) => setTimeout(r, 350));

    const target = profile ? "./lobby.html" : "./login.html";
    const url = new URL(target, location.href);
    if (incomingCode) url.searchParams.set("code", incomingCode);
    location.replace(url.toString());
  } catch (err) {
    if (err && err.message === "firebase-config-missing") return;  // صفحه‌ی راهنما نمایش داده شده
    log.error("splash", err);
    document.getElementById("spinner")?.classList.add("hidden");
    if (!navigator.onLine) {
      const last = store.get("profile", null);
      fatalScreen("اینترنت وصل نیست",
        last ? "برای ادامه‌ی بازی به اینترنت نیاز داری. بعد از اتصال دوباره تلاش کن."
             : "برای اولین ورود باید به اینترنت وصل باشی.",
        "تلاش دوباره", "./index.html");
      return;
    }
    setStatus("خطا در اتصال");
    toast("اتصال به سرور ممکن نشد. صفحه را دوباره باز کن", "error", 6000);
  }
})();
</script>
</body>
</html>
